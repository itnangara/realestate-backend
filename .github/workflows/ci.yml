name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

# ============================================================================
# Workflow-Level Configuration
# ============================================================================
# Service versions - update these to change versions across the workflow
# NOTE: Services section cannot access env context, so service image tags
# must be hardcoded but should match these values for consistency
env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15-alpine'  # Used in steps; services use hardcoded value
  REDIS_VERSION: '7-alpine'      # Used in steps; services use hardcoded value

jobs:
  # ============================================================================
  # Code Quality & Linting
  # ============================================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy types-redis
      
      - name: Run Black (code formatting check)
        run: black --check --diff app/ tests/
        continue-on-error: false
      
      - name: Run isort (import sorting check)
        run: isort --check-only --diff app/ tests/
        continue-on-error: false
      
      - name: Run Flake8 (linting)
        run: |
          flake8 app/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.pyc,.git,venv,alembic/versions \
            --count \
            --statistics
        continue-on-error: false
      
      - name: Run MyPy (type checking)
        run: |
          mypy app/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            --warn-unused-configs \
            --disallow-untyped-defs \
            || true  # Non-blocking for now
        continue-on-error: true

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
      
      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check --file requirements.txt --json || true
        continue-on-error: true
      
      - name: Run Bandit (security linting)
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            --skip B101,B601 \
            || true
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # ============================================================================
  # Unit & Integration Tests
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      # PostgreSQL service for testing
      # NOTE: GitHub Actions services section does not support env context,
      # so version must be hardcoded. Update both workflow-level env.POSTGRES_VERSION
      # and this image tag when changing PostgreSQL version.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
          POSTGRES_DB: test_real_estate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
      
      # Redis service for testing
      # NOTE: GitHub Actions services section does not support env context,
      # so version must be hardcoded. Update both workflow-level env.REDIS_VERSION
      # and this image tag when changing Redis version.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    strategy:
      fail-fast: false
      matrix:
        test-type: [unit, integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist
      
      - name: Run tests with coverage
        env:
          # Database and Redis (using services defined above)
          DATABASE_URL: postgresql://test_user:test_password_secure_123@localhost:5432/test_real_estate_db
          REDIS_URL: redis://localhost:6379
          
          # JWT Configuration (test values - not real secrets)
          SECRET_KEY: ci_test_secret_key_$(date +%s)_not_for_production
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 30
          ALGORITHM: HS256
          
          # Application Configuration
          DEBUG: "True"
          ENVIRONMENT: test
          LOG_LEVEL: INFO
          LOG_FORMAT: json
          
          # CORS and Trusted Hosts (test values)
          CORS_ORIGINS: http://localhost:3000,http://localhost:5173
          TRUSTED_HOSTS: localhost,127.0.0.1
          
          # Feature Flags (test defaults)
          KYC_ENABLED: "true"
          AUTO_APPROVE_ENABLED: "false"
          KYC_REQUIRED_FOR_SELLER: "true"
          KYC_REQUIRED_FOR_AGENT: "true"
          KYC_REQUIRED_FOR_LANDLORD: "false"
          KYC_REQUIRED_FOR_INVESTOR: "false"
          ROLE_REQUEST_ENABLED: "true"
          DOCUMENT_UPLOAD_ENABLED: "true"
          
          # AWS S3 (test values - tests mock boto3, but prevents warnings)
          AWS_ACCESS_KEY_ID: AKIATEST123456789
          AWS_SECRET_ACCESS_KEY: test_secret_key_for_ci_only
          AWS_BUCKET_NAME: test-bucket-ci
          AWS_REGION: us-east-1
          AWS_S3_PII_BUCKET: ""
          AWS_S3_PII_PATH: "pii/"
          
          # Email (test values - tests don't send real emails)
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test_password_ci_only
          MAIL_FROM: test@example.com
          MAIL_PORT: 587
          MAIL_SERVER: smtp.test.com
          MAIL_STARTTLS: "True"
          MAIL_SSL_TLS: "False"
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            pytest tests/ -v \
              --maxfail=5 \
              --tb=short \
              --cov=app \
              --cov-report=xml \
              --cov-report=html \
              --cov-report=term-missing \
              --cov-fail-under=70 \
              -m "not integration"
          else
            pytest tests/ -v \
              --maxfail=5 \
              --tb=short \
              --cov=app \
              --cov-report=xml \
              --cov-report=html \
              --cov-report=term-missing \
              -m "integration"
          fi
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test-type }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            .pytest_cache/
          retention-days: 7

  # ============================================================================
  # Test Coverage Summary
  # ============================================================================
  coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50

  # ============================================================================
  # Build & Validate Docker Image
  # ============================================================================
  build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: real-estate-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # CI Status Summary
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: CI Status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
